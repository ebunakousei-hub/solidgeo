<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SolidGeo ― 立体幾何</title>
<style>
:root{
  --bg1:#f8fafd; --bg2:#e9eff7; --panel:#fafbfd; --alt:#f0f3f8; --line:#dbe1ea;
  --text:#1c222e; --dim:#707c8e; --accent:#2366d6; --accent2:#c82d37;
  --btn:#fff; --btnHot:#ecf2fc; --btnDn:#d6e2f6; --head:#e8edf4; --field:#fff;
}
.dark{
  --bg1:#1b1f28; --bg2:#0e1116; --panel:#181b22; --alt:#1f232c; --line:#343a46;
  --text:#e4e9f1; --dim:#8c96a6; --accent:#6096ff; --accent2:#ff6e6e;
  --btn:#262b35; --btnHot:#323a4a; --btnDn:#404a5e; --head:#1e222a; --field:#14171d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;
  font-family:"Yu Gothic UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color:var(--text);background:var(--panel)}
#app{display:flex;height:100%;width:100%}
#tools{width:200px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column}
#tools h2,#panel h2{margin:0;padding:7px 12px;font-size:14px;background:var(--head);
  border-bottom:1px solid var(--line);font-weight:700}
#toolgrid{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:start}
#toolgrid button{font:inherit;font-size:11.5px;padding:6px 2px;border:1px solid var(--line);
  background:var(--btn);color:var(--text);border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden}
#toolgrid button:hover{background:var(--btnHot)}
#toolgrid button.on{background:var(--btnDn);border-color:var(--accent);color:var(--accent);font-weight:700}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#view{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default}
#cmdbar{flex:none;background:var(--head);border-top:1px solid var(--line);padding:6px 10px 4px}
#cmd{width:100%;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);
  border-radius:4px;background:var(--field);color:var(--text)}
#cmd:focus{outline:none;border-color:var(--accent)}
#msg{font-size:11.5px;color:var(--dim);padding:3px 2px 0;height:18px;overflow:hidden;white-space:nowrap}
#msg.err{color:var(--accent2)}
#panel{width:320px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column}
#objlist{overflow-y:auto;flex:1;min-height:80px}
.row{display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;border-bottom:1px solid transparent}
.row:hover{background:var(--alt)}
.row.sel{background:var(--btnDn)}
.row .vis{position:relative;width:14px;height:14px;flex:none;border:1px solid var(--line);border-radius:3px;background:var(--btn);cursor:pointer}
/* 升目そのものは小さいので、押せる範囲だけを行の高さいっぱいに広げる（見た目は変えない） */
.row .vis::after{content:'';position:absolute;left:-5px;right:-5px;top:-11px;bottom:-11px}
.row .vis.on{background:var(--accent);border-color:var(--accent)}
.row .sw{width:9px;height:9px;flex:none;border-radius:2px}
.row .nm{font-weight:700;font-size:13px;flex:none}
.row .kd{font-size:11px;color:var(--dim);flex:none}
.row .vl{font-size:11.5px;color:var(--dim);font-family:ui-monospace,Menlo,Consolas,monospace;
  margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.bad .vl{color:var(--accent2)}
.row.ghost{opacity:.62}
.row .tw{width:13px;flex:none;font-size:10px;color:var(--dim);text-align:center;cursor:pointer;user-select:none}
.row .tw:hover{color:var(--accent)}
#opts{flex:none;border-top:1px solid var(--line);padding:8px 10px;overflow-y:auto;max-height:46%}
#opts h3{margin:10px 0 5px;font-size:12px;color:var(--accent);font-weight:700;
  border-left:3px solid var(--accent);padding-left:7px}
#opts h3:first-child{margin-top:0}
label.ck{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:2px 0;cursor:pointer}
label.ck input{accent-color:var(--accent);width:14px;height:14px}
.sl{font-size:11.5px;color:var(--dim);margin-top:4px}
.sl input{width:100%;accent-color:var(--accent)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.bgrid button,.wide{font:inherit;font-size:12px;padding:5px;border:1px solid var(--line);
  background:var(--btn);color:var(--text);border-radius:4px;cursor:pointer}
.bgrid button:hover,.wide:hover{background:var(--btnHot)}
.wide{width:100%;margin-top:5px}
#hint{position:absolute;left:10px;top:8px;font-size:11.5px;color:var(--dim);
  background:rgba(255,255,255,.72);padding:3px 8px;border-radius:4px;pointer-events:none}
.dark #hint{background:rgba(20,23,29,.72)}
#burger{display:none}
@media (max-width:820px){
  #tools{position:absolute;left:0;top:0;bottom:0;z-index:9;box-shadow:0 0 20px rgba(0,0,0,.2)}
  #panel{position:absolute;right:0;top:0;bottom:0;z-index:9;box-shadow:0 0 20px rgba(0,0,0,.2)}
  #tools.hide,#panel.hide{display:none}
  #burger{display:flex;gap:6px;position:absolute;right:10px;top:8px;z-index:10}
  #burger button{font:inherit;font-size:12px;padding:5px 9px;border:1px solid var(--line);
    background:var(--btn);color:var(--text);border-radius:4px}
}
</style>

<div id="app">
  <div id="tools"><h2>道具</h2><div id="toolgrid"></div></div>
  <div id="main">
    <div id="view">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="burger"><button id="bTools">道具</button><button id="bPanel">一覧</button></div>
    </div>
    <div id="cmdbar">
      <input id="cmd" placeholder="コマンド欄：例  Midpoint(A,B) ／ 球(A,B) ／ 凸包(A,B,C,D)　―　Ctrl+V で貼り付け（何行でも可）">
      <div id="msg"></div>
    </div>
  </div>
  <div id="panel">
    <h2>対象一覧</h2>
    <div id="objlist"></div>
    <div id="opts"></div>
  </div>
</div>

<script>
"use strict";
// ===========================================================================
//  SolidGeo (Web 版) ― 立体幾何の動的作図
//  Windows 版 (C++) の geo.h をそのまま移植したもの。数学の中身は同一。
// ===========================================================================

// ---------------------------------------------------------------- 1. 数学
const PI = Math.PI;
const V = (x, y, z) => ({ x, y, z });
const add = (a, b) => V(a.x + b.x, a.y + b.y, a.z + b.z);
const sub = (a, b) => V(a.x - b.x, a.y - b.y, a.z - b.z);
const mul = (a, s) => V(a.x * s, a.y * s, a.z * s);
const neg = a => V(-a.x, -a.y, -a.z);
const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const cross = (a, b) => V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
const len2 = a => dot(a, a);
const len = a => Math.sqrt(dot(a, a));
const norm = a => { const l = len(a); return l > 1e-300 ? mul(a, 1 / l) : V(0, 0, 1); };
const det3 = (a, b, c) => dot(a, cross(b, c));
const angBetween = (a, b) => Math.atan2(len(cross(a, b)), dot(a, b));
const anyPerp = v => norm(cross(v, Math.abs(v.z) < 0.9 ? V(0, 0, 1) : V(1, 0, 0)));
const clampd = (v, a, b) => v < a ? a : (v > b ? b : v);
const degOf = r => r * 180 / PI;

// n 元連立一次方程式（M は n 行 (n+1) 列、部分ピボット選択）
function solveLin(M, n) {
  for (let c = 0; c < n; c++) {
    let piv = c, best = Math.abs(M[c * (n + 1) + c]);
    for (let r = c + 1; r < n; r++) {
      const v = Math.abs(M[r * (n + 1) + c]);
      if (v > best) { best = v; piv = r; }
    }
    if (best < 1e-13) return null;
    if (piv !== c) for (let k = 0; k <= n; k++) { const t = M[c * (n + 1) + k]; M[c * (n + 1) + k] = M[piv * (n + 1) + k]; M[piv * (n + 1) + k] = t; }
    const d = M[c * (n + 1) + c];
    for (let k = c; k <= n; k++) M[c * (n + 1) + k] /= d;
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const f = M[r * (n + 1) + c];
      if (f === 0) continue;
      for (let k = c; k <= n; k++) M[r * (n + 1) + k] -= f * M[c * (n + 1) + k];
    }
  }
  const x = [];
  for (let i = 0; i < n; i++) x.push(M[i * (n + 1) + n]);
  return x;
}
// 最小二乗（正規方程式）
function solveLstsq(A, b, m, n) {
  const M = new Array(n * (n + 1)).fill(0);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      let s = 0;
      for (let k = 0; k < m; k++) s += A[k * n + i] * A[k * n + j];
      M[i * (n + 1) + j] = s;
    }
    let s = 0;
    for (let k = 0; k < m; k++) s += A[k * n + i] * b[k];
    M[i * (n + 1) + n] = s;
  }
  return solveLin(M, n);
}

// ------------------------------------------------------------ 2. 凸包
function orderRing(p, S, n) {
  let c = V(0, 0, 0);
  for (const i of S) c = add(c, p[i]);
  c = mul(c, 1 / S.length);
  const u = norm(sub(sub(p[S[0]], c), mul(n, dot(sub(p[S[0]], c), n))));
  const w = cross(n, u);
  S.sort((a, b) =>
    Math.atan2(dot(sub(p[a], c), w), dot(sub(p[a], c), u)) -
    Math.atan2(dot(sub(p[b], c), w), dot(sub(p[b], c), u)));
}
function convexHull(p, eps = 1e-9) {
  const T = { ok: false, coplanar: false, faces: [], edges: [], deg: [], vertIdx: [], vol: 0, surf: 0 };
  const n = p.length;
  T.deg = new Array(Math.max(0, n)).fill(0);
  if (n < 4) return T;

  // 基準の平面を O(n) で決める。
  // ①p[0] からいちばん遠い点 ②その直線からいちばん離れた点、の順に選ぶだけでよい。
  // （以前は面積最大の三点組を総当たり O(n³) で探していたが、平面が決まれば十分）
  let ia = 0, bestD = -1;
  for (let l = 1; l < n; l++) { const t = len2(sub(p[l], p[0])); if (t > bestD) { bestD = t; ia = l; } }
  const e1 = sub(p[ia], p[0]);
  if (len2(e1) < 1e-24) return T;                 // 全部同じ点
  let nBest = V(0, 0, 1), bl2 = 0;
  for (let l = 0; l < n; l++) {
    const c = cross(e1, sub(p[l], p[0]));
    const t = len2(c);
    if (t > bl2) { bl2 = t; nBest = c; }
  }
  if (bl2 < 1e-24) return T;                      // 全部一直線上
  const bi = 0, n0 = norm(nBest);
  let flat = 0;
  for (let l = 0; l < n; l++) flat = Math.max(flat, Math.abs(dot(n0, sub(p[l], p[bi]))));

  const sets = [], keys = [], normals = [];
  if (flat < 1e-7) {
    T.coplanar = true;
    let c = V(0, 0, 0); for (const q of p) c = add(c, q); c = mul(c, 1 / n);
    const u = anyPerp(n0), w = cross(n0, u);
    const idx = [...Array(n).keys()];
    idx.sort((a, b) =>
      Math.atan2(dot(sub(p[a], c), w), dot(sub(p[a], c), u)) -
      Math.atan2(dot(sub(p[b], c), w), dot(sub(p[b], c), u)));
    const S = [];
    for (const i of idx) {
      while (S.length >= 2) {
        const A = p[S[S.length - 2]], B = p[S[S.length - 1]];
        if (dot(n0, cross(sub(B, A), sub(p[i], A))) > 1e-12) break;
        S.pop();
      }
      S.push(i);
    }
    if (S.length < 3) return T;
    keys.push(S.slice()); sets.push(S); normals.push(n0);
  } else {
    // 三点組ごとに配列を作らず、外で一度だけ用意して使い回す
    const d = new Float64Array(n);
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) for (let k = j + 1; k < n; k++) {
      const nn = cross(sub(p[j], p[i]), sub(p[k], p[i]));
      const nl2 = len2(nn);
      if (nl2 < 1e-24) continue;
      // 正規化しないまま判定する。d を正規化した値と比べるのは
      // d² を eps²·|nn|² と比べるのと同じなので、ここでは平方根が要らない。
      const tol2 = eps * eps * nl2;
      let pos = 0, neg = 0, mixed = false;
      for (let l = 0; l < n; l++) {
        if (l === i || l === j || l === k) { d[l] = 0; continue; }
        const dl = dot(nn, sub(p[l], p[i]));
        d[l] = dl;
        if (dl * dl > tol2) {
          // 両側に点があると分かった時点で、この三点組は面ではない
          if (dl > 0) { if (neg) { mixed = true; break; } pos++; }
          else { if (pos) { mixed = true; break; } neg++; }
        }
      }
      if (mixed || (pos === 0 && neg === 0)) continue;
      const out = mul(nn, (pos === 0 ? 1 : -1) / Math.sqrt(nl2));
      const S = [i, j, k];
      for (let l = 0; l < n; l++) {
        if (l === i || l === j || l === k) continue;
        if (d[l] * d[l] <= tol2) S.push(l);
      }
      S.sort((a, b) => a - b);
      const key = S.join(',');
      if (keys.some(q => q.join(',') === key)) continue;
      keys.push(S.slice());
      orderRing(p, S, out);
      sets.push(S); normals.push(out);
    }
  }
  if (!sets.length) return T;

  for (let q = 0; q < sets.length; q++) {
    const f = { v: sets[q], n: normals[q], c: V(0, 0, 0), area: 0 };
    let acc = V(0, 0, 0), cc = V(0, 0, 0);
    for (let t = 1; t + 1 < f.v.length; t++)
      acc = add(acc, cross(sub(p[f.v[t]], p[f.v[0]]), sub(p[f.v[t + 1]], p[f.v[0]])));
    f.area = 0.5 * len(acc);
    for (const i of f.v) cc = add(cc, p[i]);
    f.c = mul(cc, 1 / f.v.length);
    T.faces.push(f);
  }
  for (let q = 0; q < T.faces.length; q++) {
    const r = T.faces[q].v;
    for (let t = 0; t < r.length; t++) {
      let a = r[t], b = r[(t + 1) % r.length];
      if (a > b) { const s = a; a = b; b = s; }
      let found = -1;
      for (let e = 0; e < T.edges.length; e++) if (T.edges[e].a === a && T.edges[e].b === b) { found = e; break; }
      if (found < 0) T.edges.push({ a, b, f0: q, f1: -1, length: len(sub(p[a], p[b])), dihedral: 0 });
      else if (T.edges[found].f1 < 0) T.edges[found].f1 = q;
    }
  }
  for (const E of T.edges) {
    E.dihedral = (E.f0 >= 0 && E.f1 >= 0) ? PI - angBetween(T.faces[E.f0].n, T.faces[E.f1].n) : 0;
    T.deg[E.a]++; T.deg[E.b]++;
  }
  let vol = 0, surf = 0;
  for (const f of T.faces) {
    surf += f.area;
    for (let t = 1; t + 1 < f.v.length; t++)
      vol += det3(p[f.v[0]], p[f.v[t]], p[f.v[t + 1]]) / 6;
  }
  T.vol = T.coplanar ? 0 : Math.abs(vol);
  T.surf = T.coplanar ? T.faces[0].area : surf;
  for (let i = 0; i < n; i++) if (T.deg[i] > 0) T.vertIdx.push(i);
  T.ok = true;
  return T;
}

// ------------------------------------------------------- 3. 多面体の中心
function centroidVerts(p, T) {
  let s = V(0, 0, 0), n = 0;
  for (const i of T.vertIdx) { s = add(s, p[i]); n++; }
  return n ? mul(s, 1 / n) : V(0, 0, 0);
}
function centroidSurface(p, T) {
  let s = V(0, 0, 0), w = 0;
  for (const f of T.faces) for (let t = 1; t + 1 < f.v.length; t++) {
    const A = p[f.v[0]], B = p[f.v[t]], C = p[f.v[t + 1]];
    const ar = 0.5 * len(cross(sub(B, A), sub(C, A)));
    s = add(s, mul(add(add(A, B), C), ar / 3)); w += ar;
  }
  return w > 1e-15 ? mul(s, 1 / w) : V(0, 0, 0);
}
function centroidVolume(p, T) {
  const o = centroidVerts(p, T);
  let s = V(0, 0, 0), w = 0;
  for (const f of T.faces) for (let t = 1; t + 1 < f.v.length; t++) {
    const A = sub(p[f.v[0]], o), B = sub(p[f.v[t]], o), C = sub(p[f.v[t + 1]], o);
    const vv = det3(A, B, C) / 6;
    s = add(s, mul(add(add(A, B), C), vv / 4)); w += vv;
  }
  return Math.abs(w) > 1e-15 ? add(o, mul(s, 1 / w)) : o;
}
function circumsphere(p, T) {
  const vs = T.vertIdx;
  if (vs.length < 4) return null;
  const m = vs.length - 1, A = [], b = [], v0 = p[vs[0]];
  for (let i = 0; i < m; i++) {
    const vi = p[vs[i + 1]];
    A.push(2 * (vi.x - v0.x), 2 * (vi.y - v0.y), 2 * (vi.z - v0.z));
    b.push(len2(vi) - len2(v0));
  }
  const x = solveLstsq(A, b, m, 3);
  if (!x) return null;
  const O = V(x[0], x[1], x[2]), R = len(sub(p[vs[0]], O));
  const scale = Math.max(1, R);
  for (const i of vs) if (Math.abs(len(sub(p[i], O)) - R) > 1e-7 * scale) return null;
  return { O, R };
}
function insphereTangent(p, T) {
  const m = T.faces.length;
  if (m < 4) return null;
  const A = [], b = [];
  for (const f of T.faces) {
    A.push(f.n.x, f.n.y, f.n.z, 1);
    b.push(dot(f.n, p[f.v[0]]));
  }
  const x = solveLstsq(A, b, m, 4);
  if (!x) return null;
  const O = V(x[0], x[1], x[2]), r = x[3];
  if (r <= 1e-9) return null;
  const scale = Math.max(1, r);
  for (const f of T.faces) {
    const d = dot(f.n, p[f.v[0]]) - dot(f.n, O);
    if (Math.abs(d - r) > 1e-7 * scale) return null;
  }
  return { O, r };
}
function maxInsphere(p, T) {
  const m = T.faces.length;
  if (m < 4) return null;
  const nn = T.faces.map(f => f.n);
  const dd = T.faces.map(f => dot(f.n, p[f.v[0]]));
  let bestR = -1, bestO = null;
  const mm = Math.min(m, 40);
  for (let i = 0; i < mm; i++) for (let j = i + 1; j < mm; j++)
    for (let k = j + 1; k < mm; k++) for (let l = k + 1; l < mm; l++) {
      const f4 = [i, j, k, l], M = [];
      for (const q of f4) M.push(nn[q].x, nn[q].y, nn[q].z, 1, dd[q]);
      const x = solveLin(M, 4);
      if (!x) continue;
      const c = V(x[0], x[1], x[2]), rr = x[3];
      if (rr <= 1e-12) continue;
      let feasible = true;
      for (let q = 0; q < m; q++) if (dot(nn[q], c) + rr > dd[q] + 1e-9) { feasible = false; break; }
      if (feasible && rr > bestR) { bestR = rr; bestO = c; }
    }
  return bestO ? { O: bestO, r: bestR } : null;
}

// --------------------------------------------------------- 4. 対象モデル
const K = {
  NONE: 'none', POINT: 'point', SEGMENT: 'segment', LINE: 'line', RAY: 'ray',
  TRIANGLE: 'triangle', PLANE: 'plane', CIRCLE: 'circle', SPHERE: 'sphere',
  POLY: 'poly', POLYGON: 'polygon', ANGLE: 'angle', NUMBER: 'number',
  POINT4: 'point4', HYPER: 'hyper', HSPHERE: 'hsphere'   // 四次元：点・多胞体・超球
};
const KNAME = {
  point: '点', segment: '線分', line: '直線', ray: '半直線', triangle: '三角形',
  plane: '平面', circle: '円', sphere: '球', poly: '多面体', polygon: '多角形',
  angle: '角', number: '数値', none: '—',
  point4: '4D点', hyper: '多胞体', hsphere: '超球'
};
const OP = {
  FREE: 'free', ON_OBJ: 'onobj', XYZ: 'xyz', MIDPOINT: 'midpoint', SEGMENT: 'segment',
  LINE: 'line', RAY: 'ray', TRIANGLE: 'triangle', PLANE3: 'plane3', PLANE_LP: 'planeLP',
  INTERSECT: 'intersect', ANGLE3: 'angle3', ANGLE_LL: 'angleLL', ANGLE_PP: 'anglePP',

// ------------------------------------------------------------ 6.5 四次元の演算核
// C++ 版 geo4.h の移植。超立体は使用者が座標明示した 4D 点の集まりで与える。
//  ・重い計算（4D 凸包：胞→面→辺）は点が変わった時だけ（点集合のハッシュで見張る）

const v4 = (x, y, z, w) => ({ x, y, z, w });
const add4 = (a, b) => v4(a.x + b.x, a.y + b.y, a.z + b.z, a.w + b.w);

const D4_PL = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
function d4rot(vw, p) {
  const v = [p.x, p.y, p.z, p.w];

    const [i, j] = D4_PL[k];

// u1, u2, u3 に直交するベクトル（4 次元の「外積」）

    -d3(V(u1.x, u1.z, u1.w), V(u2.x, u2.z, u2.w), V(u3.x, u3.z, u3.w)),
    d3(V(u1.x, u1.y, u1.w), V(u2.x, u2.y, u2.w), V(u3.x, u3.y, u3.w)),

      dot4(sub4(q[v], c0), basis[1]), dot4(sub4(q[v], c0), basis[2])));

  }

  o.c4 = cells.length;
  o.f4 = faceSum / 2;                       // 面はちょうど 2 つの胞に共有される
  if (m !== n) {                            // まとめた点の番号で回るので詰め直す
    const np = new Array(m), nw = new Array(m);
    for (let i = 0; i < n; i++) { np[uid[i]] = o.polyPts[i]; nw[uid[i]] = o.pw[i]; }

  }

}
// 断面（毎フレーム走る軽い計算）：胞ごとに「胞 ∩ { w = t } ＝ 凸多角形」を直接作る
function d4Section(o, rp, t) {
  const out = { pt: [], face: [] };
  const n = rp.length;
  if (!n || !o.e4.length) return out;
  let mx = 1;
  for (const p of rp) mx = Math.max(mx, Math.abs(p.x), Math.abs(p.y), Math.abs(p.z), Math.abs(p.w));
  const eps = 1e-9 * (mx + Math.abs(t) + 1) * 16;
  const vIdx = new Array(n).fill(-1);
  for (let i = 0; i < n; i++)
    if (Math.abs(rp[i].w - t) <= eps) { vIdx[i] = out.pt.length; out.pt.push(V(rp[i].x, rp[i].y, rp[i].z)); }
  const nE = o.e4.length / 2;
  const eIdx = new Array(nE).fill(-1);
  const eKey = new Map();
  for (let e = 0; e < nE; e++) {
    const a = o.e4[e * 2], b = o.e4[e * 2 + 1];
    eKey.set(a + ',' + b, e);
    const wa = rp[a].w - t, wb = rp[b].w - t;
    if (Math.abs(wa) <= eps || Math.abs(wb) <= eps) continue;   // 端は頂点扱い
    if ((wa > 0) === (wb > 0)) continue;
    const s2 = wa / (wa - wb);
    const X = add4(rp[a], mul4(sub4(rp[b], rp[a]), s2));
    eIdx[e] = out.pt.length;
    out.pt.push(V(X.x, X.y, X.z));
  }
  if (!out.pt.length) return out;
  const seen = new Set();
  for (let ci = 0; ci < o.cell4.length; ci++) {
    let ids = [];
    let onCnt = 0;
    for (const v of o.cell4[ci]) if (vIdx[v] >= 0) { ids.push(vIdx[v]); onCnt++; }
    const ce = o.ce4[ci];
    for (let k = 0; k + 1 < ce.length; k += 2) {
      const e = eKey.get(ce[k] + ',' + ce[k + 1]);
      if (e !== undefined && eIdx[e] >= 0) ids.push(eIdx[e]);
    }
    ids = [...new Set(ids)];
    if (ids.length < 3) continue;
    // 胞が丸ごと超平面上（断面＝その胞そのもの）
    if (onCnt >= 4 && ids.length === onCnt) {
      const pts = ids.map(id => out.pt[id]);
      const T = convexHull(pts, eps * 8);

        for (const f of T.faces) {
          const fc = f.v.map(v => ids[v]);

          if (!seen.has(key)) { seen.add(key); out.face.push(fc); }
        }
        continue;

    }
    // ふつうの胞：平面凸多角形。Newell 法線＋重心まわりの角度で並べる
    let c = V(0, 0, 0);
    for (const id of ids) c = add(c, out.pt[id]);

    for (let k = 0; k < ids.length; k++) {

    nrm = norm(nrm);
    const u0 = norm(sub(sub(out.pt[ids[0]], c), mul(nrm, dot(sub(out.pt[ids[0]], c), nrm))));
    const v0 = cross(nrm, u0);
    ids.sort((A, B) => {
      const pa = sub(out.pt[A], c), pb = sub(out.pt[B], c);
      return Math.atan2(dot(pa, v0), dot(pa, u0)) - Math.atan2(dot(pb, v0), dot(pb, u0));
    });
    const key = [...ids].sort((a, b) => a - b).join(',');
    if (seen.has(key)) continue;
    seen.add(key);
    out.face.push(ids);
  }
  return out;
}
// 見えている 4D 対象の（回した後の）w の範囲
function d4TRange(D, vw) {
  let lo = 1e18, hi = -1e18;
  for (const o of D.objs) {
    if (!o.ok || !o.visible) continue;
    if (o.kind === K.HYPER) {
      for (const p of d4RotAll(o, vw)) { lo = Math.min(lo, p.w); hi = Math.max(hi, p.w); }
    } else if (o.kind === K.HSPHERE) {

      lo = Math.min(lo, c4.w - o.r); hi = Math.max(hi, c4.w + o.r);

let _d4AnimOn = false, _d4Last = 0;
function d4AnimStep(ts) {
  if (!_d4AnimOn) return;
  const v = st.d4;
  const need = (v.spin[0] || v.spin[1] || v.spin[2] || v.sweep) && anyD4Visible();
  if (!need) { _d4AnimOn = false; return; }
  let dt = _d4Last ? (ts - _d4Last) / 1000 : 0.016;
  _d4Last = ts;
  if (dt > 0.1) dt = 0.1;
  const pln = [2, 4, 5];                    // XW・YW・ZW
  for (let k = 0; k < 3; k++)
    if (v.spin[k]) {
      v.ang[pln[k]] += v.speed * dt;
      if (v.ang[pln[k]] > PI) v.ang[pln[k]] -= 2 * PI;
      if (v.ang[pln[k]] < -PI) v.ang[pln[k]] += 2 * PI;
    }
  if (v.sweep) {
    const [lo, hi] = d4TRange(doc, v);
    const m2 = 0.15 * (hi - lo + 0.2);
    v.t += v.sweepDir * v.speed * 0.8 * dt * (hi - lo + 0.4) * 0.5;
    if (v.t > hi + m2) { v.t = hi + m2; v.sweepDir = -1; }
    if (v.t < lo - m2) { v.t = lo - m2; v.sweepDir = 1; }
  }

  const v = st.d4;
  const need = (v.spin[0] || v.spin[1] || v.spin[2] || v.sweep) && anyD4Visible();

      const first = doc.get(st.sel[0]);
      if (first && first.kind === K.SEGMENT) wantPoint = false;
    }
    if (st.tool === 'plane3') {
      for (const sid of st.sel) { const q = doc.get(sid); if (q && isLineLike(q.kind)) { wantPoint = true; break; } }
    }
    if (!wantPoint) { say('対象をクリックしてください', true); return; }
    if (!st.sel.length) pushUndo();
    const o = newObj();
    o.op = OP.FREE; o.kind = K.POINT; o.color = COL.point;
    o.a = pickSpace(mx, my, 0);
    id = doc.add(o);
    doc.recompute();
  }
  pickedForTool(id);
}

function canvasPos(ev) {
  const r = cv.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
// 選んである対象をもう一度ダブルクリックしたら隠す。

cv.addEventListener('dblclick', ev => {

  const p = canvasPos(ev);

  // Ctrl なしなら取り出してある部分を、Ctrl つきなら多面体そのものを指す
  let id = pk.id;
  if (pk.sub && !(ev.ctrlKey || ev.metaKey)) { const z = findSub(pk.sub); id = z ? z.id : 0; }
  const o = id ? doc.get(id) : null;
  if (!o || o.builtin || !st.sel.includes(id)) return;
  pushUndo();
  o.visible = false;
  st.sel = []; st.propId = 0; st.hoverId = 0; st.hoverSub = null;
  say(o.name + ' を隠しました（一覧の升目で戻せます）');

});
cv.addEventListener('mousedown', ev => {
  if (ev.button === 2 || ev.button === 1) {
    if (ev.button === 2 && isVarPointTool(st.tool) && st.sel.length) { finishVarTool(); refresh(); return; }
    st.panning = true;
    const p = canvasPos(ev); st.lastX = p.x; st.lastY = p.y;
    return;
  }

  const p = canvasPos(ev);
  st.dragVertical = ev.shiftKey;
  st.pressCtrl = ev.ctrlKey || ev.metaKey;
  if (st.tool === 'move') {
    const pk = pickObject(p.x, p.y);
    const o = pk.id ? doc.get(pk.id) : null;
    const movable = o && o.kind === K.POINT && (o.op === OP.FREE || o.op === OP.XYZ || o.op === OP.ON_OBJ);
    if (pk.id && movable && !st.pressCtrl) {
      pushUndo(); st.dragId = pk.id; st.sel = [pk.id]; st.propId = pk.id;
    } else if (pk.id) {
      st.pendingSel = pk.id; st.pendingSub = pk.sub; st.pendingCtrl = st.pressCtrl;
      st.movedFar = false; st.pressX = p.x; st.pressY = p.y;
    } else { st.orbiting = true; st.sel = []; st.propId = 0; }
  } else {
    st.pendingTool = true; st.movedFar = false; st.pressX = p.x; st.pressY = p.y;
  }
  st.lastX = p.x; st.lastY = p.y;
  draw();          // 押した時点では絵だけ更新（一覧は離した時にまとめて）
});
window.addEventListener('mousemove', ev => {
  const p = canvasPos(ev);
  if ((st.pendingTool || st.pendingSel) && !st.movedFar &&
    Math.hypot(p.x - st.pressX, p.y - st.pressY) > 5) {
    st.movedFar = true; st.orbiting = true; st.lastX = p.x; st.lastY = p.y;
  }
  if (st.dragId) {
    const o = doc.get(st.dragId);
    if (o) {
      const rd = cam.rayDir(p.x, p.y);
      if (o.op === OP.ON_OBJ && o.args.length) {
        const host = doc.get(o.args[0]);
        if (host && host.ok) {
          let target = add(cam.eye, mul(rd, cam.dist));
          if (host.kind === K.SPHERE) {
            const f = sub(cam.eye, host.a);
            const bq = 2 * dot(f, rd), cq = len2(f) - host.r * host.r, disc = bq * bq - 4 * cq;
            if (disc >= 0) target = add(cam.eye, mul(rd, (-bq - Math.sqrt(disc)) / 2));
            else target = add(host.a, mul(norm(sub(add(cam.eye, mul(rd, -dot(f, rd))), host.a)), host.r));
          } else if (host.kind === K.PLANE || host.kind === K.TRIANGLE ||
                     host.kind === K.POLYGON || host.kind === K.CIRCLE) {
            const pl = objPlane(host), den = dot(pl.n, rd);
            if (Math.abs(den) > 1e-9) target = add(cam.eye, mul(rd, dot(pl.n, sub(pl.p, cam.eye)) / den));
          } else {
            const ln = objLineLike(host);
            if (ln) {
              const w0 = sub(ln.p, cam.eye);
              const aa = dot(ln.d, ln.d), bb = dot(ln.d, rd);
              const dd = dot(ln.d, w0), ee = dot(rd, w0);
              const den = aa - bb * bb;
              if (Math.abs(den) > 1e-12) target = add(ln.p, mul(ln.d, (bb * ee - dd) / den));
            }
          }
          pointOnSetFrom(host, o, target);
        }
      } else {
        if (st.dragVertical) {
          const n = norm(V(cam.fwd.x, cam.fwd.y, 0)), den = dot(n, rd);
          if (Math.abs(den) > 1e-6) {
            const t = dot(n, sub(o.a, cam.eye)) / den;
            o.a = V(o.a.x, o.a.y, add(cam.eye, mul(rd, t)).z);
          }
        } else {
          if (Math.abs(rd.z) > 1e-6) {
            const t = (o.a.z - cam.eye.z) / rd.z;
            if (t > .05) { const X = add(cam.eye, mul(rd, t)); o.a = V(X.x, X.y, o.a.z); }
          }
        }
        o.op = OP.FREE;
      }
      doc.recompute();
    }
  } else if (st.orbiting) {
    // 左右の回転は「図をつかんで回す」向き（右へ引けば図も右へ回る）。
    // 上下の回転も平行移動も同じ向きなので、三つの操作で流儀が揃う。
    // Ctrl（Mac では Option）を押しながらなら四次元の回転（横＝XW、縦＝YW。Shift も押すと横＝ZW）。
    if ((ev.ctrlKey || ev.altKey) && anyD4Visible()) {
      st.d4.ang[ev.shiftKey ? 5 : 2] += (p.x - st.lastX) * .008;
      st.d4.ang[4] += (p.y - st.lastY) * .008;
      for (let k = 0; k < 6; k++) {
        if (st.d4.ang[k] > PI) st.d4.ang[k] -= 2 * PI;
        if (st.d4.ang[k] < -PI) st.d4.ang[k] += 2 * PI;
      }
    } else {
      cam.yaw -= (p.x - st.lastX) * .008; cam.pitch += (p.y - st.lastY) * .008;
    }
  } else if (st.panning) {
    const k = cam.dist * .0016;
    cam.target = add(sub(cam.target, mul(cam.right, (p.x - st.lastX) * k)), mul(cam.up, (p.y - st.lastY) * k));
  } else if (ev.target === cv) {
    const pk = pickObject(p.x, p.y);
    if (pk.id !== st.hoverId || !sameSub(pk.sub, st.hoverSub)) {
      st.hoverId = pk.id; st.hoverSub = pk.sub; draw();
    }
    cv.style.cursor = pk.id ? 'pointer' : 'default';
  }
  st.lastX = p.x; st.lastY = p.y;
  if (st.dragId || st.orbiting || st.panning) draw();
});

// タッチ（iPad など）：1 本指はマウス左、2 本指は平行移動と拡大縮小
let touchMode = 0, lastDist = 0, lastMid = null;
cv.addEventListener('touchstart', ev => {
  ev.preventDefault();
  if (ev.touches.length === 1) {
    touchMode = 1;
    const t = ev.touches[0];
    cv.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY, button: 0 }));
  } else if (ev.touches.length === 2) {
    touchMode = 2;
    window.dispatchEvent(new MouseEvent('mouseup', { clientX: 0, clientY: 0 }));
    const [a, b] = ev.touches;
    lastDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    lastMid = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
  }
}, { passive: false });
cv.addEventListener('touchmove', ev => {
  ev.preventDefault();
  if (touchMode === 1 && ev.touches.length === 1) {
    const t = ev.touches[0];
    window.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY }));
  } else if (touchMode === 2 && ev.touches.length === 2) {
    const [a, b] = ev.touches;
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const mid = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
    if (lastDist > 0) cam.dist = clampd(cam.dist * (lastDist / d), .5, 200);
    const k = cam.dist * .0016;
    cam.target = add(sub(cam.target, mul(cam.right, (mid.x - lastMid.x) * k)), mul(cam.up, (mid.y - lastMid.y) * k));
    lastDist = d; lastMid = mid;
    draw();
  }
}, { passive: false });
cv.addEventListener('touchend', ev => {
  ev.preventDefault();
  if (touchMode === 1) {
    const t = ev.changedTouches[0];
    window.dispatchEvent(new MouseEvent('mouseup', { clientX: t.clientX, clientY: t.clientY }));
  }
  touchMode = 0; lastDist = 0;
}, { passive: false });

    else { st.histPos = -1; cmdEl.value = ''; }

window.addEventListener('keydown', ev => {

function fmt(v) {
  let s = v.toFixed(6);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}
function objValue(o) {
  if (!o.ok) return o.note ? trJP(o.note) : (LANG === 'ja' ? '（作れません）' : '(cannot be created)');
  const ja = LANG === 'ja';
  switch (o.kind) {
    case K.POINT: return `(${o.a.x.toFixed(3)}, ${o.a.y.toFixed(3)}, ${o.a.z.toFixed(3)})`;
    case K.SEGMENT: return (ja ? '長さ ' : 'Length ') + len(sub(o.b, o.a)).toFixed(5);
    case K.SPHERE: case K.CIRCLE: return (ja ? '半径 ' : 'Radius ') + o.r.toFixed(5);
    case K.ANGLE: return degOf(o.r).toFixed(4) + '°';
    case K.NUMBER: return fmt(o.r);
    case K.TRIANGLE: return (ja ? '面積 ' : 'Area ') + (0.5 * len(cross(sub(o.b, o.a), sub(o.c, o.a)))).toFixed(5);
    case K.PLANE: return (ja ? '法線 (' : 'Normal (') + o.b.x.toFixed(3) + ', ' + o.b.y.toFixed(3) + ', ' + o.b.z.toFixed(3) + ')';
    case K.LINE: case K.RAY: {
      const d = norm(sub(o.b, o.a));
      return (ja ? '方向 (' : 'Direction (') + d.x.toFixed(3) + ', ' + d.y.toFixed(3) + ', ' + d.z.toFixed(3) + ')';
    }
    case K.POLY: return `V=${o.topo.vertIdx.length} E=${o.topo.edges.length} F=${o.topo.faces.length}`;
    case K.POINT4: return `(${o.a.x.toFixed(3)}, ${o.a.y.toFixed(3)}, ${o.a.z.toFixed(3)}, ${o.r.toFixed(3)})`;
    case K.HYPER: return ja ? `頂点 ${o.polyPts.length}　辺 ${o.e4.length / 2}　面 ${o.f4}　胞 ${o.c4}`
      : `V=${o.polyPts.length} E=${o.e4.length / 2} F=${o.f4} C=${o.c4}`;
    case K.HSPHERE: return ja ? `半径 ${o.r.toFixed(5)}（中心 w=${o.b.x.toFixed(3)}）`
      : `Radius ${o.r.toFixed(5)} (center w=${o.b.x.toFixed(3)})`;
    case K.POLYGON: return ja ? (o.polyPts.length + ' 角形　面積 ' + o.r.toFixed(5))
      : (o.polyPts.length + '-gon, area ' + o.r.toFixed(5));
  }
  return '';
}
// 対象 z が、多面体の部分 sub そのものかどうか。
// 見比べ方はここ 1 か所にまとめ、探す範囲だけを呼ぶ側で決める。
// 面は頂点の並べ方（始点・回り方）が違っても同じ面なので、番号の集まりとして見比べる。
function subMatches(z, sub) {
  const op = sub.type === 'edge' ? OP.POLY_EDGE : OP.POLY_FACE;
  if (z.op !== op || z.args[0] !== sub.poly) return false;
  if (sub.type === 'edge')
    return z.idx.length === 2 &&
      ((z.idx[0] === sub.i && z.idx[1] === sub.j) || (z.idx[0] === sub.j && z.idx[1] === sub.i));
  return z.idx.length === sub.verts.length && sub.verts.every(v => z.idx.includes(v));
}
// 既に取り出してある部分（辺・面）を探す
function findSub(sub) {
  return doc.objs.find(o => subMatches(o, sub)) || null;
}
// 同じ場所に点が既にあるかを探す。
// 外接球と多面体の交点（＝頂点）のように、作っても札が重なるだけの点を防ぐ。
function findSamePoint(p, skipId) {
  const tol = 1e-7 * Math.max(1, sceneRadius());
  for (const o of doc.objs) {
    if (o.id === skipId || !o.ok || o.kind !== K.POINT) continue;
    if (len(sub(o.a, p)) <= tol) return o;
  }
  return null;
}
function chooseObject(id) {

  else { st.sel = [id]; st.propId = id; }
  refresh();
}

// 綴りは同じで、引数の型によって別の op に分かれるものは FN_TABLE に載っていない。
// 書き出すときは元の綴りに戻す（読み直せば resolveOp が同じ op を選び直す）。
function fnNameOf(op) {
  if (op === OP.ANGLE_LL || op === OP.ANGLE_PP) return 'angle';
  if (op === OP.PLANE_LP) return 'plane';
  if (op === OP.SPHERE_CR || op === OP.SPHERE4) return 'sphere';
  if (op === OP.PERPBIS_LINE) return 'perpbisector';
  const fn = FN_TABLE.find(f => f[1] === op);
  return fn ? fn[0] : null;
}
function scriptText() {
  const out = ['# SolidGeo 作図ファイル'];
  for (const o of doc.objs) {
    if (o.builtin) continue;                   // 座標軸は読込側で用意する
    if (o.op === OP.FREE || o.op === OP.XYZ) out.push(`${o.name} = (${o.a.x}, ${o.a.y}, ${o.a.z})`);
    else if (o.op === OP.XYZW) out.push(`${o.name} = (${o.a.x}, ${o.a.y}, ${o.a.z}, ${o.r})`);
    else if (o.op === OP.NUMBER) out.push(`${o.name} = ${o.r}`);
    else if (o.op === OP.POLY_EDGE || o.op === OP.POLY_FACE) {
      const h = doc.get(o.args[0]); if (!h) continue;
      const fn = o.op === OP.POLY_EDGE ? 'edge' : 'face';
      out.push(`${o.name} = ${fn}(${h.name}, ${o.idx.map(i => i + 1).join(', ')})`);
    }
    else if (o.op === OP.INTERSECT && o.variant > 0) {
      const a0 = doc.get(o.args[0]), a1 = doc.get(o.args[1]);
      if (!a0 || !a1) continue;
      out.push(`${o.name} = intersect(${a0.name}, ${a1.name}, ${o.variant + 1})`);
    }
    else {
      const fn = fnNameOf(o.op);
      if (!fn) continue;
      const args = o.args.map(a => { const q = doc.get(a); return q ? q.name : null; });
      if (args.some(a => !a)) continue;
      // 対象上の点は媒介変数で持っているので、居場所も書き添えて読込時に合わせ直す
      const at = (o.op === OP.ON_OBJ && o.ok) ? ` @ ${o.a.x} ${o.a.y} ${o.a.z}` : '';
      out.push(`${o.name} = ${fn}(${args.join(', ')})${at}`);
    }
  }

}

// clear = true … ファイル読込（いまの作図を捨てる）
// clear = false … 貼り付け（いまの作図に足す）
function runLines(text, clear) {
  pushUndo();
  if (clear) { doc.clear(); doc.addAxes(); st.sel = []; }
  let ok = 0, ng = 0, first = '';
  for (const raw of text.split(/\r?\n/)) {
    let line = raw.trim();
    if (!line || line[0] === '#') continue;
    // 「対象上の点」の行には、どこに居たかが「… @ x y z」として付いている。
    // 位置ではなく媒介変数で覚える対象なので、作ってから合わせ直す。
    let where = '';
    const at = line.lastIndexOf(' @ ');
    if (at >= 0) { where = line.slice(at + 3); line = line.slice(0, at); }
    const r = runCommand(doc, line);
    if (!r.id) { ng++; if (!first) first = line + ' → ' + r.err; continue; }
    ok++;
    const c = where.split(/\s+/).map(Number);
    if (c.length === 3 && c.every(v => isFinite(v))) {
      const p = doc.get(r.id), h = p && p.args.length ? doc.get(p.args[0]) : null;
      if (p && h) { pointOnSetFrom(h, p, V(c[0], c[1], c[2])); doc.recompute(); }
    }
  }
  doc.recompute();
  fitView();
  say((clear ? `読み込みました（成功 ${ok} / 失敗 ${ng}）`
             : `${ok + ng} 行を貼り付けて実行しました（成功 ${ok} / 失敗 ${ng}）`)
      + (first ? '　' + first : '')
      + (first.indexOf('使われています') >= 0 ? '　― 同じ名前の対象がすでにあります。「全消去」してから貼り付けてください' : ''),
      ng > 0);

}
// クリップボードから貼り付ける（何行もあれば、そのまま順に実行する）
function pasteLines(text) {
  const lines = String(text).replace(/\r/g, '').split('\n');
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  if (!lines.length) return false;
  if (lines.length === 1) return false;      // 1 行なら入力欄への貼り付けに任せる
  runLines(lines.join('\n'), false);
  refresh();
  return true;
}

// LANG が日本語なら何もしない（自己テストは常にこの経路を通らない＝挙動は今までどおり）
function trJP(s) {
  if (LANG !== 'en' || !s) return s;
  if (EXACT_MAP[s] !== undefined) return EXACT_MAP[s];
  let t = s;
  for (const [re, rep] of TR_RULES) t = t.replace(re, rep);
  return t;
}

// ------------------------------------------------------ 16. 自己テスト
function runSelfTest() {
  const R = [];
  let fails = 0;
  const chk = (n, ok) => { R.push((ok ? '[OK] ' : '[NG] ') + n); if (!ok) fails++; };
  const num = (n, got, want, tol) => {
    const ok = Math.abs(got - want) <= tol;
    R.push((ok ? '[OK] ' : '[NG] ') + n + ' got=' + got.toFixed(12) + ' want=' + want.toFixed(12));
    if (!ok) fails++;
  };
  const D = new Doc();
  const run = s => runCommand(D, s);
  const g = s => D.byName(s);

  for (const s of ['A=(0,0,0)', 'B=(4,0,0)', 'C=(0,3,0)', 'D=(0,0,5)']) chk(s, run(s).id !== 0);
  chk('中点', run('M=Midpoint(A,B)').id !== 0);
  num('中点の x', g('M').a.x, 2, 1e-12);
  chk('直線', run('a=Line(A,B)').id !== 0);
  chk('平面', run('pl=Plane(A,B,C)').id !== 0);
  num('平面の法線 z', Math.abs(g('pl').b.z), 1, 1e-12);
  run('w1=Angle(B,A,C)'); num('∠BAC = 90°', degOf(g('w1').r), 90, 1e-9);
  run('w2=Angle(A,B,C)'); num('∠ABC', degOf(g('w2').r), degOf(Math.atan2(3, 4)), 1e-9);
  run('pl2=Plane(A,B,D)'); run('w3=Angle(pl,pl2)');
  num('2 平面のなす角', degOf(g('w3').r), 90, 1e-9);
  run('ln=Line(A,B)'); chk('直線と点から平面', run('plp=Plane(ln,C)').id !== 0);
  num('その法線 z', Math.abs(g('plp').b.z), 1, 1e-12);
  chk('直線上の点では平面を作らない', run('bad=Plane(ln,(2,0,0))').id === 0);
  run('E=(2,2,7)'); run('pf=Foot(E,pl)');
  num('平面への垂足 z', g('pf').a.z, 0, 1e-12);
  run('pf2=Foot(E,a)'); num('直線への垂足 x', g('pf2').a.x, 2, 1e-12);
  run('pb=PerpBisector(A,B)'); num('垂直二等分面の通る点', g('pb').a.x, 2, 1e-12);
  run('sg=Segment(A,B)'); chk('線分から垂直二等分面', run('pbs=PerpBisector(sg)').id !== 0);
  num('その通る点', g('pbs').a.x, 2, 1e-12);
  run('s1=Sphere(A,B)'); num('球の半径', g('s1').r, 4, 1e-12);
  run('s2=Sphere(A,B,C,D)'); num('4 点球の中心 x', g('s2').a.x, 2, 1e-9);
  run('tp=TangentPlane(s1,B)'); num('接平面の法線 x', Math.abs(g('tp').b.x), 1, 1e-12);
  run('c1=Circle(A,B,C)'); num('3 点円の半径', g('c1').r, 2.5, 1e-9);
  run('x1=Intersect(a,pb)'); num('直線と平面の交点 x', g('x1').a.x, 2, 1e-12);
  run('x2=Intersect(pl,pl2)'); chk('平面と平面の交線', g('x2').kind === K.LINE);
  run('x3=Intersect(pl,s1)'); num('平面と球の交円の半径', g('x3').r, 4, 1e-9);

  // n 角形の面
  {
    const E = new Doc();
    for (const s of ['A=(0,0,0)', 'B=(2,0,0)', 'C=(2,2,0)', 'D=(0,2,0)']) runCommand(E, s);
    const f = E.get(runCommand(E, 'f=polygon(A,B,C,D)').id);
    chk('4 点から面が作れる', f && f.ok && f.kind === K.POLYGON);
    if (f) { chk('4 角形になる', f.polyPts.length === 4); num('面積 = 4', f.r, 4, 1e-12); }
    chk('3 点でも面が作れる', runCommand(E, 't=polygon(A,B,C)').id !== 0);
    runCommand(E, 'Z=(0,2,1)');
    const bad = runCommand(E, 'g=polygon(A,B,C,Z)');
    chk('同一平面上にないと作らない', bad.id === 0);
    chk('その理由が「同一平面上にありません」', bad.err === '同一平面上にありません');
    for (const s of ['L1=(0,0,0)', 'L2=(1,0,0)', 'L3=(2,0,0)']) runCommand(E, s);
    chk('一直線上でも作らない', runCommand(E, 'gg=polygon(L1,L2,L3)').id === 0);
    runCommand(E, 'Q=(1,1,3)');
    chk('面への垂線がひける', runCommand(E, 'pp=Perpendicular(Q,f)').id !== 0);
    const ar = runCommand(E, 'ar=Area(f)');
    if (ar.id) num('Area(n角形)', E.get(ar.id).r, 4, 1e-12);
  }
  // 多面体の面と辺
  {
    const E = new Doc();
    const nm = ['P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', 'P8'];
    let t = 0;
    for (let i = 0; i < 2; i++)for (let j = 0; j < 2; j++)for (let k = 0; k < 2; k++)
      runCommand(E, nm[t++] + '=(' + i + ',' + j + ',' + k + ')');
    runCommand(E, 'h=Hull(P1,P2,P3,P4,P5,P6,P7,P8)');
    const eo = E.get(runCommand(E, 'e1=edge(h,1,2)').id);
    chk('辺を取り出せる', eo && eo.ok && eo.kind === K.SEGMENT);
    if (eo) num('その辺の長さ', len(sub(eo.b, eo.a)), 1, 1e-12);
    chk('辺の中点がとれる', runCommand(E, 'm1=Midpoint(e1)').id !== 0);
    const fo = E.get(runCommand(E, 'f1=face(h,1,2,4,3)').id);
    chk('面を取り出せる', fo && fo.ok && fo.kind === K.POLYGON);
    if (fo) { chk('面は 4 角形', fo.polyPts.length === 4); num('面の面積', fo.r, 1, 1e-12); }
    runCommand(E, 'Q=(0.5,0.5,3)');
    chk('面への垂線がひける（多面体の面）', runCommand(E, 'pp=Perpendicular(Q,f1)').id !== 0);
    chk('面への垂足がとれる', runCommand(E, 'pf=Foot(Q,f1)').id !== 0);
    E.byName('P2').a = V(2, 0, 0);
    E.recompute();
    const eo2 = E.byName('e1');
    chk('親を動かすと辺も伸びる', eo2 && eo2.ok && Math.abs(len(sub(eo2.b, eo2.a)) - 2) < 1e-9);
  }
  // 四面体
  {
    const E = new Doc();
    for (const s of ['A=(0,0,0)', 'B=(1,0,0)', 'C=(0,1,0)', 'D=(0,0,1)', 'h=Hull(A,B,C,D)']) runCommand(E, s);
    const h = E.byName('h');
    num('四面体の体積', h.topo.vol, 1 / 6, 1e-12);
    chk('F=4, E=6', h.topo.faces.length === 4 && h.topo.edges.length === 6);
    runCommand(E, 'g1=Centroid(h)');
    num('体積重心 x', E.byName('g1').a.x, .25, 1e-12);
    runCommand(E, 'cs=Circumsphere(h)');
    num('外接球の中心 x', E.byName('cs').a.x, .5, 1e-9);
    runCommand(E, 'ins=Insphere(h)');
    num('内接球の半径', E.byName('ins').r, 1 / (3 + Math.sqrt(3)), 1e-9);
    runCommand(E, 'mi=MaxInsphere(h)');
    num('最大内接球＝内接球', E.byName('mi').r, 1 / (3 + Math.sqrt(3)), 1e-9);
  }
  // 立方体と交わり
  {
    const E = new Doc();
    const nm = ['P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', 'P8'];
    let t = 0;
    for (let i = 0; i < 2; i++)for (let j = 0; j < 2; j++)for (let k = 0; k < 2; k++)
      runCommand(E, `${nm[t++]}=(${i},${j},${k})`);
    runCommand(E, 'h=Hull(P1,P2,P3,P4,P5,P6,P7,P8)');
    const h = E.byName('h');
    num('立方体の体積', h.topo.vol, 1, 1e-12);
    num('立方体の表面積', h.topo.surf, 6, 1e-12);
    chk('F=6, E=12', h.topo.faces.length === 6 && h.topo.edges.length === 12);
    runCommand(E, 'cs=Circumsphere(h)'); num('外接球半径 √3/2', E.byName('cs').r, Math.sqrt(3) / 2, 1e-9);
    runCommand(E, 'ins=Insphere(h)'); num('内接球半径 1/2', E.byName('ins').r, .5, 1e-9);
    runCommand(E, 'A9=(-1,-1,-1)'); runCommand(E, 'B9=(2,2,2)'); runCommand(E, 'l9=Line(A9,B9)');
    const p1 = intersectPoints(E.byName('l9'), h);
    chk('直線と立方体の交点は 2 個', p1.length === 2);
    if (p1.length === 2) {
      num('手前の交点', len(sub(p1[0], V(0, 0, 0))), 0, 1e-9);
      num('奥の交点', len(sub(p1[1], V(1, 1, 1))), 0, 1e-9);
    }
    runCommand(E, 'C9=(0.2,0.2,0.2)'); runCommand(E, 'sg9=Segment(A9,C9)');
    chk('線分では範囲外を拾わない', intersectPoints(E.byName('sg9'), h).length === 1);
    runCommand(E, 'Q1=(1.1,0.5,0.5)'); runCommand(E, 'Q2=(0.2,1.019615,0.5)');
    runCommand(E, 'Q3=(0.2,-0.019615,0.5)'); runCommand(E, 'c9=Circle(Q1,Q2,Q3)');
    const p3 = intersectPoints(E.byName('c9'), h);
    chk('円と立方体の交点は 8 個', p3.length === 8);
    let onSurf = p3.length > 0;
    for (const p of p3) {
      const d = Math.min(Math.abs(p.x), Math.abs(p.x - 1), Math.abs(p.y), Math.abs(p.y - 1));
      if (d > 1e-7) onSurf = false;
      if (Math.abs(len(sub(p, V(.5, .5, .5))) - .6) > 1e-6) onSurf = false;
    }
    chk('どの交点も面上かつ円周上', onSurf);

    // 多面体 x 球：接しているときだけ有限個の点（＝面ごとの接点）になる
    const si = E.byName('ins');
    const p4 = intersectPoints(h, si);
    chk('立方体と内接球の交わりは 6 点', p4.length === 6);
    let tang = p4.length > 0;
    for (const p of p4) {
      if (Math.abs(len(sub(p, V(.5, .5, .5))) - .5) > 1e-7) tang = false;
      const d = Math.min(Math.abs(p.x), Math.abs(p.x - 1), Math.abs(p.y), Math.abs(p.y - 1),
        Math.abs(p.z), Math.abs(p.z - 1));
      if (d > 1e-7) tang = false;
    }
    chk('どの接点も球面上かつ面上', tang);
    chk('順序を入れ替えても同じ', intersectPoints(si, h).length === 6);
    runCommand(E, 'Z9=(0.5,0.5,0.5)'); runCommand(E, 'Z8=(0.5,0.5,1.05)');
    runCommand(E, 'sb9=Sphere(Z9,Z8)');
    const p6 = intersectPoints(h, E.byName('sb9'));
    chk('面を切る球との交わりは点にならない', p6.length === 0 && p6.curved === true);
    const rr = runCommand(E, 'xx9=Intersect(h,sb9)');
    chk('その場合は理由を返す', rr.id === 0 && rr.err.indexOf('円弧') >= 0);
  }
  // 四面体の内接球：接点は 4 つ
  {
    const E = new Doc();
    for (const s of ['A=(0,0,0)', 'B=(1,0,0)', 'C=(0,1,0)', 'D=(0,0,1)', 'h1=Hull(A,B,C,D)',
      's1=Insphere(h1)', 's2=MaxInsphere(h1)']) runCommand(E, s);
    const h1 = E.byName('h1'), s1 = E.byName('s1');
    const pts = intersectPoints(h1, s1);
    chk('四面体と内接球の交わりは 4 点', pts.length === 4);
    let good = pts.length === 4;
    for (const p of pts) if (Math.abs(len(sub(p, s1.a)) - s1.r) > 1e-7) good = false;
    chk('4 点はどれも内接球の球面上', good);
    chk('底面（z=0）にも接点がある', pts.some(p => Math.abs(p.z) < 1e-9));
    chk('最大内接球でも 4 点', intersectPoints(h1, E.byName('s2')).length === 4);
    // 外接球との交わりは頂点そのもの
    runCommand(E, 'cs=Circumsphere(h1)');
    const pv = intersectPoints(h1, E.byName('cs'));
    chk('外接球との交わりは頂点 4 個', pv.length === 4);
    chk('その 4 点は四面体の頂点そのもの',
      pv.every(p => h1.polyPts.some(q => len(sub(p, q)) < 1e-7)));
  }
  // 球面上の 5 点（手で打った丸めのある座標）でも、頂点 5 個が出ること
  {
    const E = new Doc();
    for (const s of ['O=(0,0,0)', 'R=(1,0,0)', 's=Sphere(O,R)',
      'P1=(1,0,0)', 'P2=(-0.3,0.9539392,0)', 'P3=(-0.5,-0.5,0.7071068)',
      'P4=(-0.5,-0.5,-0.7071068)', 'P5=(0.2,0.3,0.9327379)',
      'h=Hull(P1,P2,P3,P4,P5)']) runCommand(E, s);
    const pts = intersectPoints(E.byName('h'), E.byName('s'));
    chk('球面上の 5 点：多面体と球の交わりは 5 点', pts.length === 5);
    chk('5 点はどれも元の頂点',
      pts.every(p => E.byName('h').polyPts.some(q => len(sub(p, q)) < 1e-6)));
  }
  // 外接球が存在しない場合
  {
    const E = new Doc();
    for (const s of ['A=(0,0,0)', 'B=(1,0,0)', 'C=(0,1,0)', 'D=(0,0,1)', 'F=(2,2,2)', 'h=Hull(A,B,C,D,F)'])
      runCommand(E, s);
    chk('外接球が無ければ作らない', runCommand(E, 'cs=Circumsphere(h)').id === 0);
    chk('最大内接球はそれでも求まる', runCommand(E, 'mi=MaxInsphere(h)').id !== 0);
  }
  // 依存関係
  {
    const E = new Doc();
    runCommand(E, 'A=(0,0,0)');
    const bid = runCommand(E, 'B=(2,0,0)').id;
    const mid = runCommand(E, 'M=Midpoint(A,B)').id;
    E.get(bid).a = V(10, 0, 0);
    E.recompute();
    num('親を動かすと子も動く', E.get(mid).a.x, 5, 1e-12);
    E.remove(bid);
    chk('親を消すと子も消える', E.get(mid) === null);
  }
  // 細工された作図ファイルでも壊れないこと
  {
    const E = new Doc();
    E.addAxes();
    for (const s of ['A=(0,0,0)', 'B=(1,0,0)', 'C=(0,1,0)', 'D=(0,0,1)', 'h=Hull(A,B,C,D)']) runCommand(E, s);
    const deep = 'q=' + 'midpoint(A,'.repeat(4000) + 'B' + ')'.repeat(4000);
    chk('深い入れ子は断る', runCommand(E, deep).id === 0);
    chk('長すぎる名前は断る', runCommand(E, 'A'.repeat(500) + '=(1,2,3)').id === 0);
    chk('引数が多すぎるものは断る', runCommand(E, 'hull(' + 'A,'.repeat(300) + 'B)').id === 0);
    chk('範囲外の頂点番号は断る', runCommand(E, 'e1=edge(h,1,999)').id === 0);
    chk('桁の大きすぎる頂点番号も断る', runCommand(E, 'e2=edge(h,1,1e300)').id === 0);
    chk('桁の大きすぎる交点番号も断る', runCommand(E, 'x1=Intersect(x軸,y軸,1e300)').id === 0);
    chk('閉じ括弧が無い行は断る', runCommand(E, 'm=midpoint(A,B').id === 0);
    chk('途中で切れた座標は断る', runCommand(E, 'P=(1,2').id === 0);
    chk('空の括弧は断る', runCommand(E, 'm=midpoint()').id === 0);
    chk('桁あふれする座標は断る', runCommand(E, 'P=(1e400,0,0)').id === 0);
    chk('桁あふれする数も断る', runCommand(E, 'nn=1e400').id === 0);
    runCommand(E, 'Q1=(1e300,0,0)'); runCommand(E, 'Q2=(-1e300,1e300,0)');
    const bad = runCommand(E, 'sp=Sphere(Q1,Q2)').id;
    chk('計算が発散した対象は ok にしない', !bad || !E.get(bad).ok);
    chk('残った対象はすべて有限の値', E.objs.every(x => !x.ok || finiteObj(x)));
    chk('それでも作図は壊れていない', !!E.byName('h') && E.byName('h').ok);
  }
  // 既にある点に座標を書くと、その点が動くこと
  {
    const E = new Doc();
    E.addAxes();
    runCommand(E, 'A=(0,0,0)'); runCommand(E, 'B=(4,0,0)');
    const mid = runCommand(E, 'M=Midpoint(A,B)').id;
    const n0 = E.objs.length;
    const r1 = runCommand(E, 'B=(10,0,0)');
    chk('既にある点に座標を書ける', r1.id !== 0 && !r1.err && r1.moved === true);
    chk('新しい対象は増えない', E.objs.length === n0);
    num('その点が動く', E.byName('B').a.x, 10, 1e-12);
    num('依存する対象も追従する', E.get(mid).a.x, 5, 1e-12);
    const pid = runCommand(E, 'P=pointon(x軸)').id;
    runCommand(E, 'P=(3.5,9,-4)');
    const p = E.get(pid);
    chk('軸上の点は軸から外れない',
      Math.abs(p.a.x - 3.5) < 1e-12 && Math.abs(p.a.y) < 1e-12 && Math.abs(p.a.z) < 1e-12);
    chk('他から決まる点は動かせない', runCommand(E, 'M=(1,1,1)').id === 0);
    chk('座標軸は動かせない', runCommand(E, 'x軸=(1,1,1)').id === 0);
    runCommand(E, 'sp=Sphere(A,B)');
    chk('点でない対象も動かせない', runCommand(E, 'sp=(1,1,1)').id === 0);
    chk('座標以外を書いたときは今までどおり名前の重複',
      runCommand(E, 'B=Midpoint(A,M)').err.indexOf('使われています') >= 0);
  }
  // 座標軸
  {
    const E = new Doc();
    E.addAxes();
    chk('最初から x軸・y軸・z軸 がある', E.objs.length === 3);
    const ax = E.byName('x軸'), ay = E.byName('y軸'), az = E.byName('z軸');
    chk('どれも原点を通る直線', [ax, ay, az].every(o => o && o.kind === K.LINE && len(o.a) < 1e-12));
    chk('向きが x, y, z',
      len(sub(sub(ax.b, ax.a), V(1, 0, 0))) < 1e-12 &&
      len(sub(sub(ay.b, ay.a), V(0, 1, 0))) < 1e-12 &&
      len(sub(sub(az.b, az.a), V(0, 0, 1))) < 1e-12);
    runCommand(E, 'A=(2,1,3)');
    const l = E.get(runCommand(E, 'l=Parallel(A,z軸)').id);
    chk('z軸に平行な直線が引ける', l && l.ok && len(sub(sub(l.b, l.a), V(0, 0, 1))) < 1e-12);
    const pl = E.get(runCommand(E, 'pl=PerpendicularPlane(A,x軸)').id);
    chk('x軸に垂直な平面が作れる', pl && pl.ok && len(cross(pl.b, V(1, 0, 0))) < 1e-12);
    num('z軸までの距離 = √5', E.get(runCommand(E, 'n1=Distance(A,z軸)').id).r, Math.sqrt(5), 1e-12);
    num('x軸とy軸のなす角 = 90°', E.get(runCommand(E, 'w1=Angle(x軸,y軸)').id).r, PI / 2, 1e-12);
    const P = E.get(runCommand(E, 'P=pointon(x軸)').id);
    chk('軸上の点が作れる', P && P.ok && P.op === OP.ON_OBJ);
    pointOnSetFrom(ax, P, V(3.5, 9, -4));            // 軸から離れた所を指しても
    E.recompute();
    chk('軸上に留まる', Math.abs(P.a.x - 3.5) < 1e-12 && Math.abs(P.a.y) < 1e-12 && Math.abs(P.a.z) < 1e-12);
    const n0 = E.objs.length;
    E.remove(ax.id);
    chk('座標軸は消せない', E.objs.length === n0);
  }
  // 道具で作った点が、既にある点と重なるときの振る舞い（札の重なり防止）。
  // ここだけは本物の作図（global の doc）を使うので、終わったら元に戻す。
  {
    const saved = scriptText(), savedTool = st.tool;
    const setup = lines => { loadText(lines.join('\n')); st.msg = ''; };
    const apply = (tool, names) => {
      st.tool = tool;
      st.sel = names.map(n => doc.byName(n).id);
      applyTool();
    };
    setup(['A=(0,0,0)', 'B=(2,0,0)', 'C=(1,2,0)', 'D=(1,1,2)', 'h=Hull(A,B,C,D)', 'cs=Circumsphere(h)']);
    let n0 = doc.objs.length;
    apply('intersect', ['h', 'cs']);
    chk('外接球との交点は作らない', doc.objs.length === n0);
    chk('どの点と重複したかを伝える', st.msg.indexOf('重複') >= 0 && st.msg.indexOf('A, B, C, D') >= 0);

    setup(['O=(0,0,0)', 'Z=(0,0,1)', 's=Sphere(O,Z)', 'A=(1,0,0)', 'B=(0,0.2,0.1)', 'l=Line(A,B)']);
    n0 = doc.objs.length;
    apply('intersect', ['l', 's']);
    chk('重複しない側だけを作る', doc.objs.length === n0 + 1);
    chk('重複した点の名前を伝える', st.msg.indexOf('A と重複') >= 0);

    setup(['A=(0,0,0)', 'B=(2,0,0)', 'C=(1,2,0)', 'D=(1,1,2)', 'h=Hull(A,B,C,D)', 'si=Insphere(h)']);
    n0 = doc.objs.length;
    apply('intersect', ['h', 'si']);
    chk('重ならない交点はそのまま作る', doc.objs.length === n0 + 4);

    setup(['A=(0,0,0)', 'B=(2,0,0)', 'M=(1,0,0)']);
    n0 = doc.objs.length;
    apply('midpoint', ['A', 'B']);
    chk('中点が重なるときも作らない', doc.objs.length === n0);
    chk('重なった点を選んでおく',
      st.sel.length === 1 && doc.get(st.sel[0]) && doc.get(st.sel[0]).name === 'M');

    // 保存 → 読込 でどの作図も戻ってくること（綴りが引数の型で分かれるものが落ちやすい）
    setup(['A=(0,0,0)', 'B=(3,0,0)', 'C=(0,4,0)', 'D=(1,1,5)',
      'l1=Line(A,B)', 'l2=Line(A,C)', 'w1=Angle(l1,l2)',
      'p1=Plane(A,B,C)', 'p2=Plane(A,B,D)', 'w2=Angle(p1,p2)', 'p3=Plane(l1,D)',
      's1=Sphere(A,2)', 's2=Sphere(A,B,C,D)', 'm1=PerpBisector(A,B,p1)',
      'g1=Polygon(A,B,C)', 'P1=pointon(l1)']);
    pointOnSetFrom(doc.byName('l1'), doc.byName('P1'), V(2.25, 0, 0));
    doc.recompute();
    const before = doc.objs.map(o => [o.name, o.kind, o.ok, o.a.x, o.a.y, o.a.z, o.r]);
    loadText(scriptText());
    const after = doc.objs.map(o => [o.name, o.kind, o.ok, o.a.x, o.a.y, o.a.z, o.r]);
    chk('保存して読み直すと対象の数が同じ', before.length === after.length);
    chk('名前・種類・値もそのまま戻る', JSON.stringify(before) === JSON.stringify(after));
    chk('座標軸は二重にならない', doc.objs.filter(o => o.op === OP.AXIS).length === 3);

    loadText(saved); st.tool = savedTool; st.sel = []; st.msg = '';
  }
  // 多言語対応：LANG の値に関わらず内部状態（st.msg・自己テスト）は日本語のまま、
  // ---- 四次元（C++ 版 geo4 の自己診断と同じ観点）----
  {
    const D4 = new Doc(); D4.addAxes();
    const r4 = t => runCommand(D4, t);
    const g4 = t => D4.byName(t);
    let rr = r4('P1 = (1, -2, 0.5, 3)');
    chk('4D: (x, y, z, w) で 4D 点ができる', !rr.err && !!g4('P1') && g4('P1').kind === K.POINT4);
    num('4D: w 成分が入る', g4('P1').r, 3, 1e-12);
    rr = r4('P1 = (0, 0, 0, -1)');
    chk('4D: 4 成分の再代入で動く', !rr.err && rr.moved === true && g4('P1').r === -1);
    rr = r4('P1 = (1, 2, 3)');
    chk('4D: 4D 点に 3 成分を書くと断る', !!rr.err && rr.err.includes('4 次元の点です'));
    r4('Q1 = (1, 1, 1)');
    rr = r4('Q1 = (1, 1, 1, 1)');
    chk('4D: 3D 点に 4 成分を書くと断る', !!rr.err && rr.err.includes('3 次元の点です'));

    // 見本 5 種の (頂点, 辺, 面, 胞) とオイラー標数 V−E+F−C=0
    const want = [[5, 10, 10, 5], [16, 32, 24, 8], [8, 24, 32, 16], [24, 96, 96, 24], [36, 72, 48, 12]];
    const nm5 = ['正五胞体', '正八胞体', '正十六胞体', '正二十四胞体', '六角二重柱'];
    const kept = [];
    for (let i = 0; i < 5; i++) {
      const DD = new Doc(); DD.addAxes();
      let perr = '';
      for (const c of d4PresetCmds(i, DD)) { const q = runCommand(DD, c); if (q.err && !perr) perr = q.err; }
      const H = DD.objs.find(o => o.kind === K.HYPER);
      kept.push(H || null);
      const got = H ? [H.polyPts.length, H.e4.length / 2, H.f4, H.c4] : [0, 0, 0, 0];
      chk(`4D: ${nm5[i]} (V,E,F,C)=(${want[i].join(',')}) 実測 (${got.join(',')})${perr ? ' err=' + perr : ''}`,
        !perr && got.join(',') === want[i].join(','));
      if (H) chk(`4D: ${nm5[i]} オイラー V−E+F−C=0`, got[0] - got[1] + got[2] - got[3] === 0);
    }

    // 断面：テッセラクト w=0 → 立方体（8 頂点・6 面）、範囲外 → 空、回しても閉じる
    const ID4 = { ang: [0, 0, 0, 0, 0, 0], t: 0, dist: 3.5, persp: false };
    const RV4 = { ang: [0.3, 0.2, 0.7, 0.1, 0.4, 0.25], t: 0, dist: 3.5, persp: false };
    const HT = kept[1];
    if (HT) {
      let sec = d4Section(HT, d4RotAll(HT, ID4), 0);
      chk('4D: テッセラクト w=0 の断面は立方体（頂点 8・面 6）', sec.pt.length === 8 && sec.face.length === 6);
      sec = d4Section(HT, d4RotAll(HT, ID4), 9);
      chk('4D: 範囲外の断面は空', sec.pt.length === 0 && sec.face.length === 0);
      sec = d4Section(HT, d4RotAll(HT, RV4), 0.2);
      chk('4D: 回した断面も閉じた立体（頂点 ≥ 4・面 ≥ 4）', sec.pt.length >= 4 && sec.face.length >= 4);
    }
    const H16 = kept[2];
    if (H16) {
      const sec = d4Section(H16, d4RotAll(H16, ID4), 0);
      chk('4D: 正十六胞体 w=0 の断面は正八面体（頂点 6・面 8）', sec.pt.length === 6 && sec.face.length === 8);
    }

    // 回転は等長変換（距離を保つ）
    {
      const a4 = v4(0.3, -1.2, 0.7, 2.1), b4 = v4(-0.5, 0.4, 1.1, -0.6);
      num('4D: 回転は等長変換', len4(sub4(d4rot(RV4, a4), d4rot(RV4, b4))), len4(sub4(a4, b4)), 1e-12);
    }

    // 超球：sphere4(中心, 半径) と断面半径 √(r²−(t−w)²)
    {
      const DS = new Doc(); DS.addAxes();
      runCommand(DS, 'O1 = (0.5, 0, 0, 0.25)');
      const rs = runCommand(DS, 'G1 = sphere4(O1, 2)');
      const GS = DS.byName('G1');
      chk('4D: sphere4 で超球ができる', !rs.err && !!GS && GS.kind === K.HSPHERE && GS.r === 2 && GS.b.x === 0.25);
      if (GS) num('4D: 超球の断面半径の式', Math.sqrt(GS.r * GS.r - (1 - GS.b.x) * (1 - GS.b.x)), Math.sqrt(4 - 0.5625), 1e-12);
    }

    // ハッシュの見張り：点が同じなら重い再計算をしない・動かせば作り直す
    {
      const DH = new Doc(); DH.addAxes();
      for (const c of d4PresetCmds(0, DH)) runCommand(DH, c);
      const b0 = g_d4HullBuilds;
      DH.recompute();
      chk('4D: 点が同じなら凸包を作り直さない', g_d4HullBuilds === b0);
      const PV = DH.objs.find(o => o.kind === K.POINT4);
      runCommand(DH, `${PV.name} = (${PV.a.x}, ${PV.a.y}, ${PV.a.z}, ${PV.r + 0.3})`);
      chk('4D: 点を動かすと作り直す', g_d4HullBuilds === b0 + 1);
    }

    // 4 次元に広がらない点集合（全部 w=0）は日本語で断る
    {
      const DR = new Doc(); DR.addAxes();
      runCommand(DR, 'R0 = (0, 0, 0, 0)'); runCommand(DR, 'R1 = (2, 0, 0, 0)');
      runCommand(DR, 'R2 = (0, 2, 0, 0)'); runCommand(DR, 'R3 = (0, 0, 2, 0)');
      runCommand(DR, 'R4 = (1, 1, 1, 0)');
      const rf = runCommand(DR, 'HF = hull4(R0, R1, R2, R3, R4)');
      chk('4D: 4 次元に広がらない点集合は断る', !!rf.err && rf.err.includes('広がって'));
    }

    // 保存 → 読み込みの往復（scriptText / loadText。既定の作図は退避して戻す）
    {
      const keep = JSON.stringify(doc.objs.map(o => ({ ...o, topo: null })));
      const keepN = doc.nextId, keepU = st.undo.length;
      loadText('A1 = (1, 0, 0, 0)\nA2 = (-1, 0.2, 0, 0)\nA3 = (0, 1, 0.3, 0)\nA4 = (0, 0, 1, 0)\nA5 = (0.1, 0.2, 0.3, 1.4)\nHH = hull4(A1, A2, A3, A4, A5)');
      const H1 = doc.byName('HH');
      chk('4D: 読み込みで多胞体ができる', !!H1 && H1.kind === K.HYPER && H1.c4 === 5);
      const txt = scriptText();
      chk('4D: 保存に 4 成分の座標が残る', txt.includes('(0.1, 0.2, 0.3, 1.4)') && txt.includes('hull4('));
      loadText(txt);
      const H2 = doc.byName('HH');
      chk('4D: 往復しても同じ多胞体', !!H2 && H2.kind === K.HYPER && H2.c4 === 5 && H2.polyPts.length === 5);
      while (st.undo.length > keepU) st.undo.pop();
      doc.objs = JSON.parse(keep); doc.nextId = keepN; doc.recompute();
    }

    // 速さ：いちばん重い見本（正二十四胞体）を回して切っても 1 コマが軽い
    {
      const DP = new Doc(); DP.addAxes();
      for (const c of d4PresetCmds(3, DP)) runCommand(DP, c);
      const HP = DP.objs.find(o => o.kind === K.HYPER);
      const vw = { ang: [0, 0, 0, 0, 0, 0], t: 0, dist: 3.5, persp: true };
      const t0 = performance.now();
      let acc = 0;
      for (let f = 0; f < 60; f++) {
        vw.ang[2] += 0.01; vw.ang[4] += 0.007;
        vw.t = Math.sin(f * 0.1) * 1.2;
        const rp = d4RotAll(HP, vw);
        const sec = d4Section(HP, rp, vw.t);
        acc += sec.pt.length;
        for (const q of rp) d4place(vw, q);
      }
      const ms = (performance.now() - t0) / 60;
      chk(`4D: 回転＋断面は 1 コマ ${ms.toFixed(3)} ms（20 ms 未満）`, ms < 20 && acc > 0);
    }
  }

  // 訳語の抜けがなく、英語表記の軸名でも同じ対象を指せることを確かめる
  {
    const savedLang = LANG;
    LANG = 'en';
    const savedMsg = st.msg, savedErr = st.msgErr;
    say('交わりません', true);
    chk('LANG=en でも say() は日本語のまま st.msg に入れる（自己テストとの独立性）', st.msg === '交わりません');
    st.msg = savedMsg; st.msgErr = savedErr;

    chk('LANG=en：完全一致の訳がある', trJP('交わりません') === "They don't intersect");
    chk('LANG=en：動的なメッセージも訳す', trJP('A を作りました（点）') === 'Created A (Point)');
    chk('辞書に無い文はそのまま返す（表示が欠けない）', trJP('これは辞書に無い文です') === 'これは辞書に無い文です');
    LANG = 'ja';
    chk('LANG=ja では trJP は素通し', trJP('交わりません') === '交わりません');
    LANG = savedLang;

    let allK = true;
    for (const k of Object.keys(KNAME)) if (!(k in KNAME_EN)) allK = false;
    chk('すべての種類に英語名がある', allK);
    let allT = true;
    for (const td of TOOLS) if (!TOOL_EN[td[0]]) allT = false;
    chk('すべての道具に英語のラベル・ヒントがある', allT);

    const E = new Doc(); E.addAxes();
    const p1 = runCommand(E, 'P1=pointon(x軸)'), p2 = runCommand(E, 'P2=pointon(xAxis)'), p3 = runCommand(E, 'P3=pointon(x_axis)');
    chk('英語表記の軸名 xAxis でも同じ対象を指せる',
      p1.id !== 0 && p2.id !== 0 && E.get(p2.id).args[0] === E.get(p1.id).args[0]);
    chk('英語表記の軸名 x_axis でも同じ対象を指せる',
      p3.id !== 0 && E.get(p3.id).args[0] === E.get(p1.id).args[0]);
  }
  R.push(fails === 0 ? '結果: 全項目 合格（NG 0 件）' : `結果: 不合格あり（NG ${fails} 件）`);
  return { fails, text: R.join('\n') };
}

// 外から検証できるように公開しておく
window.SG = {
  doc, cam, st, runCommand, intersectPoints, intersectObjs, convexHull,
  runSelfTest, loadText, runLines, pasteLines, scriptText, refresh, draw, drawNow, fitView, T, TOOLS,
  toolClick, pickedForTool, pickObject, applyTool, deleteObjects, V, len, sub,
  materializeSub, findSub, sameSub, K, OP, Doc, makePolygon, objFacePlane,
  getLang: () => LANG, setLang, trJP, kindName, toolLabel, toolHint, KNAME_EN, TOOL_EN,
  // 四次元（外からの検証用）
  v4, d4rot, d4place, d4RotAll, d4Section, d4TRange, d4PresetCmds, d4PresetCount,
  placeD4Preset, anyD4Visible, getD4Builds: () => g_d4HullBuilds
};

// ------------------------------------------------------------ 起動
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(document.getElementById('view'));
if ((navigator.hardwareConcurrency || 4) < 4) st.lowSpec = true;
doc.addAxes();
say('左の道具を選んで作図します。コマンド欄に打ち込むこともできます。');
refresh();
resize();
requestAnimationFrame(resize);   // 最初の割りつけが決まってからもう一度合わせる
if (location.hash === '#selftest') {
  const r = runSelfTest();
  document.title = (r.fails === 0 ? 'PASS' : 'FAIL ' + r.fails) + ' — SolidGeo';
  console.log(r.text);
}
</script>
